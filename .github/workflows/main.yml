name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the "main" branch
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4.0.0
        with:
          python-version: 3.9
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Execute generator script
        run: python generator/main.py
      - name: Push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -I'^ *"(version|last_updated)":' -- docs; then
            echo "Only version/timestamp changes, skipping commit"
            exit 0
          fi
          git add docs/characters.html \
            docs/index.html \
            docs/domains.html \
            docs/assets/characters.json \
            docs/assets/domains.json \
            docs/hsr/assets/characters.json \
            docs/hsr/assets/domains.json
          git commit -m "Update data"
          git push